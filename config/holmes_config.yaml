# -----------------------------------------------------------------------------
# Custom YAML Toolsets
# -----------------------------------------------------------------------------
# Paths to additional YAML toolset files (relative to this config file).
custom_toolsets:
  - "toolsets/rest_api_toolset.yaml"
  - "toolsets/kibana_toolset.yaml"
  # - "toolsets/k6_toolset.yaml"
  # - "toolsets/database_toolset.yaml"

# -----------------------------------------------------------------------------
# Investigation Defaults
# -----------------------------------------------------------------------------
investigation:
  # Default system prompt additions for the RCA agent
  system_prompt: >
    You are an expert SRE / DevOps engineer performing root cause analysis.
    Always gather evidence from multiple sources before concluding.
    Prioritize actionable findings over speculation.
    Structure your response with: Summary, Evidence, Root Cause, Recommendations.

  # Timeout for a single investigation (seconds)
  timeout: 300

  # Maximum number of tool calls per investigation
  max_tool_calls: 50

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8092
