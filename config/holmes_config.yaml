# =============================================================================
# Fixora Diagnostic Orchestrator - HolmesGPT Configuration
# =============================================================================
# This file configures HolmesGPT as the RCA (Root Cause Analysis) engine.
# All sections are optional - HolmesGPT will use sensible defaults.
# Environment variables can be referenced as: {{ env.VAR_NAME }}

# -----------------------------------------------------------------------------
# LLM Provider Configuration
# -----------------------------------------------------------------------------
# Supported providers via LiteLLM:
#   - Ollama:    ollama_chat/<model>
#   - OpenAI:    gpt-4.1, gpt-4.1-mini, etc.
#   - Anthropic: anthropic/claude-sonnet-4-5-20250929
#   - Azure:     azure/<deployment-name>
#   - Bedrock:   bedrock/<model-id>
#   - Gemini:    gemini/<model>
llm:
  model: "ollama_chat/qwen3:4b"
  api_base: "http://localhost:11434"          # Ollama server URL
  # api_key: "{{ env.LLM_API_KEY }}"         # Not needed for Ollama
  max_steps: 30                               # Max agentic loop iterations
  temperature: 0.7

  # Optional: fallback model for simpler tasks (summarization, formatting)
  # fast_model: "ollama_chat/qwen3:4b"

# -----------------------------------------------------------------------------
# Built-in Toolsets
# -----------------------------------------------------------------------------
# Toggle HolmesGPT's built-in toolsets on/off.
# When enabled, they auto-detect prerequisites (e.g., kubectl on PATH).
builtin_toolsets:
  kubernetes:
    enabled: true
  grafana:
    enabled: true
    env:
      GRAFANA_URL: "{{ env.GRAFANA_BASE_URL }}"
      GRAFANA_API_KEY: "{{ env.GRAFANA_API_KEY }}"
  grafana_loki:
    enabled: false
    env:
      LOKI_URL: "{{ env.LOKI_URL }}"
  grafana_tempo:
    enabled: false
    env:
      TEMPO_URL: "{{ env.TEMPO_URL }}"
  kafka:
    enabled: true
    env:
      KAFKA_BOOTSTRAP_SERVERS: "{{ env.KAFKA_BOOTSTRAP_SERVERS }}"
  elasticsearch:
    enabled: true
    env:
      ELASTICSEARCH_URL: "{{ env.ELASTICSEARCH_URL }}"
      ELASTICSEARCH_API_KEY: "{{ env.ELASTICSEARCH_API_KEY }}"
  datadog:
    enabled: false
    env:
      DD_API_KEY: "{{ env.DD_API_KEY }}"
      DD_APP_KEY: "{{ env.DD_APP_KEY }}"
  rabbitmq:
    enabled: false
  mongodb_atlas:
    enabled: false
  database:
    enabled: true
    env:
      DATABASE_URL: "{{ env.POSTGRES_URL }}"

